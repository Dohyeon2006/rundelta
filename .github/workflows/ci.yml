name: Public Linux candidate

on:
  pull_request:
  push:
    branches: [main, public-export]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Inspect the actual candidate, not GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure isolated paths
        run: |
          # Runner paths exist at step execution, not job-level env evaluation.
          printf 'CARGO_TARGET_DIR=%s\nRUNDELTA_UNPACK_DIR=%s\n' \
            "$RUNNER_TEMP/rundelta-build" "$RUNNER_TEMP/rundelta-unpacked" >> "$GITHUB_ENV"
      - name: Validate workflow syntax and contexts
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          python3 -B tests/test_export_safety.py --workflow "$RUNNER_TEMP/actionlint/actionlint"
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace build-essential python3
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and synthetic CLI contracts
        run: |
          cargo test --locked
          # Frozen unit tests leave an empty scratch parent. Reject leftovers;
          # never recursively clean away data before the privacy scan.
          if [ -e target ]; then rmdir target; fi
      - name: Real CLI and finalization boundary
        run: cargo test --locked --test public_cli -- --ignored --exact public_cli_workflow
      - name: Export checker counterexamples
        run: python3 -B tests/test_export_safety.py
      - name: Source and complete history scan
        run: python3 -B tools/check_export.py --root . --history
      - name: Package and archive scan
        run: |
          cargo package --locked
          python3 -B tools/check_export.py --root . --history \
            --archive "$CARGO_TARGET_DIR/package/RunDelta-0.2.0-alpha.1.crate"
      - name: Test the actual unpacked package
        run: |
          mkdir "$RUNDELTA_UNPACK_DIR"
          tar -xf "$CARGO_TARGET_DIR/package/RunDelta-0.2.0-alpha.1.crate" \
            -C "$RUNDELTA_UNPACK_DIR"
          cd "$RUNDELTA_UNPACK_DIR/RunDelta-0.2.0-alpha.1"
          export CARGO_TARGET_DIR="$RUNDELTA_UNPACK_DIR/build"
          cargo test --locked
          if [ -e target ]; then rmdir target; fi
          cargo test --locked --test public_cli -- --ignored --exact public_cli_workflow
          python3 -B tests/test_export_safety.py
      - name: Confirm checkout stayed clean
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B tools/check_export.py --root . --history
