[package]
name = "RunDelta"
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dohyeon2006/rundelta"
description = "Compare observed Linux command executions and file access with strace."
readme = "docs/CRATE_README.md"
keywords = ["cli", "linux", "strace", "debugging", "rust"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Deliberate source distribution; independent of repository/global gitignore.
# Internal reports, evidence, probes, IDE state and generated files are excluded.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/docs/CRATE_README.md",
    "/src/main.rs",
    "/src/cli.rs",
    "/src/capture/mod.rs",
    "/src/capture/owner.rs",
    "/src/capture/completion.rs",
    "/src/capture/reduction.rs",
    "/src/capture/platform_exit.rs",
    "/src/capture/supervision.rs",
    "/src/capture/policy.rs",
    "/src/parse/mod.rs",
    "/src/parse/fs_tests.rs",
    "/src/model/mod.rs",
    "/src/store/mod.rs",
    "/src/store/deletion.rs",
    "/src/diff/mod.rs",
    "/src/report/mod.rs",
]

[[bin]]
name = "rundelta"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
